[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devport"
version = "0.1.0"
description = "A single source of truth for local dev ports. Stop the 3000/3001 turf war."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Umair Aziz" }]
keywords = ["dev", "ports", "registry", "localhost", "direnv", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
devport = "devport.cli:main"

[project.urls]
Homepage = "https://github.com/uaziz1/devport"
Issues = "https://github.com/uaziz1/devport/issues"
Changelog = "https://github.com/uaziz1/devport/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/devport"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
